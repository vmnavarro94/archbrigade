# Menus
bindd = SUPER, SPACE, Launch apps, exec, uwsm app -- walker -p "Start…"
bindd = SUPER CTRL, E, Emoji picker, exec, uwsm app -- walker -m Emojis
bindd = SUPER ALT, SPACE, ArchBrigade menu, exec, archbrigade-menu
bindd = SUPER, ESCAPE, Power menu, exec, archbrigade-menu system
bindld = , XF86PowerOff, Power menu, exec, archbrigade-menu system
bindd = SUPER, K, Show key bindings, exec, archbrigade-menu-keybindings
bindd = , XF86Calculator, Calculator, exec, gnome-calculator

# Aesthetics
bindd = SUPER SHIFT, SPACE, Toggle top bar, exec, archbrigade-toggle-waybar
bindd = SUPER CTRL, SPACE, Next background in theme, exec, archbrigade-theme-bg-next
bindd = SUPER SHIFT CTRL, SPACE, Pick new theme, exec, archbrigade-menu theme
bindd = SUPER, BACKSPACE, Toggle window transparency, exec, hyprctl dispatch setprop "address:$(hyprctl activewindow -j | jq -r '.address')" opaque toggle

# Notifications
bindd = SUPER, COMMA, Dismiss last notification, exec, makoctl dismiss
bindd = SUPER SHIFT, COMMA, Dismiss all notifications, exec, makoctl dismiss --all
bindd = SUPER CTRL, COMMA, Toggle silencing notifications, exec, makoctl mode -t do-not-disturb && makoctl mode | grep -q 'do-not-disturb' && notify-send "Silenced notifications" || notify-send "Enabled notifications"

# Toggle idling
bindd = SUPER, L, Lock screen, exec, archbrigade-lock-screen
bindd = SUPER CTRL, I, Toggle locking on idle, exec, archbrigade-toggle-idle

# Toggle nightlight
bindd = SUPER CTRL, N, Toggle nightlight, exec, archbrigade-toggle-nightlight

# Control Apple Display brightness
bindd = CTRL, F1, Apple Display brightness down, exec, archbrigade-cmd-apple-display-brightness -5000
bindd = CTRL, F2, Apple Display brightness up, exec, archbrigade-cmd-apple-display-brightness +5000
bindd = SHIFT CTRL, F2, Apple Display full brightness, exec, archbrigade-cmd-apple-display-brightness +60000

# Screenshots
bindd = SUPER CTRL, PRINT, Extract text from region, exec, archbrigade-cmd-text-extraction
bindd = SUPER SHIFT, S, Screenshot of region, exec, archbrigade-cmd-screenshot
bindd = , PRINT, Screenshot of region, exec, archbrigade-cmd-screenshot
bindd = SHIFT, PRINT, Screenshot of window, exec, archbrigade-cmd-screenshot window
bindd = CTRL, PRINT, Screenshot of display, exec, archbrigade-cmd-screenshot output

# Screen recordings
bindd = SUPER SHIFT, R, Screen record a region, exec, archbrigade-screenrecord-toggle region
bindd = ALT, PRINT, Screen record a region, exec, archbrigade-cmd-screenrecord region
bindd = ALT SHIFT, PRINT, Screen record a region with audio, exec, archbrigade-cmd-screenrecord region audio
bindd = CTRL ALT, PRINT, Screen record display, exec, archbrigade-cmd-screenrecord output
bindd = CTRL ALT SHIFT, PRINT, Screen record display with audio, exec, archbrigade-cmd-screenrecord output audio

# Color picker
bindd = SUPER, PRINT, Color picker, exec, pkill hyprpicker || hyprpicker -a

# File sharing
bindd = CTRL SUPER, S, Share, exec, archbrigade-menu share
