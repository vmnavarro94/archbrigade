# Floating windows
windowrule = match:tag floating-window, float
windowrule = match:tag floating-window, center
windowrule = match:tag floating-window, size 800 600

windowrule = match:class (blueberry.py|Impala|Wiremix|org.gnome.NautilusPreviewer|com.gabm.satty|ArchBrigade|About|TUI.float), tag +floating-window
windowrule = match:class (xdg-desktop-portal-gtk|sublime_text|DesktopEditors|org.gnome.Nautilus), title:^(Open.*Files?|Open [F|f]older.*|Save.*Files?|Save.*As|Save|All Files), tag +floating-window

# Fullscreen screensaver
windowrule = match:class Screensaver, fullscreen

# No transparency on media windows
windowrule = match:class ^(zoom|vlc|mpv|org.kde.kdenlive|com.obsproject.Studio|com.github.PintaProject.Pinta|imv|org.gnome.NautilusPreviewer)$, opacity 1 1
