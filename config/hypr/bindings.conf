# Application bindings
$terminal = uwsm app -- $TERMINAL
$browser = archbrigade-launch-browser

bindd = SUPER, return, Terminal, exec, archbrigade-launch-terminal
bindd = SUPER, E, File manager, exec, uwsm app -- nautilus --new-window
bindd = SUPER, B, Browser, exec, $browser
bindd = SUPER SHIFT, B, Browser (private), exec, $browser --private
bindd = SUPER, M, Music, exec, archbrigade-launch-or-focus spotify
bindd = SUPER, N, Editor, exec, archbrigade-launch-editor
bindd = SUPER, T, Activity, exec, $terminal -e btop
bindd = SUPER, D, Docker, exec, $terminal -e lazydocker
bindd = SUPER, O, Obsidian, exec, archbrigade-launch-or-focus obsidian "uwsm app -- obsidian -disable-gpu --enable-wayland-ime"
bindd = SUPER, slash, Passwords, exec, uwsm app -- bitwarden

# If your web app url contains #, type it as ## to prevent hyperland treat it as comments
bindd = SUPER, Y, YouTube, exec, archbrigade-launch-or-focus-webapp YouTube "https://youtube.com/"
bindd = SUPER SHIFT, G, WhatsApp, exec, archbrigade-launch-or-focus-webapp WhatsApp "https://web.whatsapp.com/"

# Overwrite existing bindings, like putting ArchBrigade Menu on Super + Space
# unbind = SUPER, SPACE
# bindd = SUPER, SPACE, ArchBrigade menu, exec, archbrigade-menu
